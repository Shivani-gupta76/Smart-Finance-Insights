{% extends "layout.html" %}

{% block title %}
Budgets
{% endblock %}

{% block css %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/budget.css') }}">
{% endblock %}

{% block page_title %}
Budget Management
{% endblock %}

{% block content %}

<div class="budget-container">

    <div class="budget-card">

        <h2>Monthly Budget</h2>

        <form method="POST">

            <div class="form-group">
                <label>Budget Amount</label>
                <input
                    type="number"
                    name="monthly_budget"
                    step="0.01"
                    required
                    value="{{ budget.monthly_budget if budget else '' }}">
            </div>

            <div class="form-group">
                <label>Month</label>
                <input
                    type="text"
                    name="month"
                    placeholder="July"
                    required
                    value="{{ budget.month if budget else '' }}">
            </div>

            <div class="form-group">
                <label>Year</label>
                <input
                    type="number"
                    name="year"
                    placeholder="2026"
                    required
                    value="{{ budget.year if budget else '' }}">
            </div>

            <button type="submit" class="btn-save">
                {% if budget %}
                    Update Budget
                {% else %}
                    Save Budget
                {% endif %}
            </button>

        </form>

    </div>

</div>

{% endblock %}
